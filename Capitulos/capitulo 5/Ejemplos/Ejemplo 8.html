<!DOCTYPE html>

<!-- Fig. 5.9: reflejo.html -->
<!-- Reflejos en CSS3. -->
<html>
<head>
<meta charset="utf-8">
<title>Reflejo</title>
<style type="text/css">
img {margin-right: 30px;}
img.below
{
   -webkit-box-reflect: below 5px
      -webkit-gradient(
         linear, left top, left bottom,
         from(transparent), to(white));
}
img.right
{
   -webkit-box-reflect: right 5px
      -webkit-gradient(
         linear, right top, left top,
         from(transparent), to(white));
}
</style>
</head>
<body>
<!-- Cambia "deitel.png" por el nombre de tu imagen si se llama diferente -->
<img class="below" src="Imagen1.png"
     alt="Portada del libro Java How to Program">
<img class="right" src="Imagen2.png"
     alt="Portada del libro Java How to Program">
</body>
</html>
