<!-- Crear un gradiente lineal diagonal. -->

<html>
<head>
    <meta charset="utf-8">
    <title>Gradiente lineal</title>

    <style type="text/css">

        div
        {
            width: 500px;
            height: 500px;
            background: linear-gradient(
                45deg,
                red,
                orange,
                yellow,
                green,
                blue,
                indigo,
                violet
            );
        }

    </style>
</head>

<body>

    <div></div>

</body>
