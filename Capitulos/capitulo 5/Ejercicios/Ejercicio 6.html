<!DOCTYPE html>

<!-- Ejercicio 5.6: sombra.html -->
<!-- Crear sombras para elementos. -->

<html>
<head>
    <meta charset="utf-8">
    <title>Sombra de elementos</title>

    <style type="text/css">

        div
        {
            width: 200px;
            height: 200px;
            margin: 30px;
        }

        #uno
        {
            background-color: LightBlue;
            box-shadow: 15px 15px 20px dimgrey;
        }

        #dos
        {
            background-color: LightGreen;
            box-shadow: -15px -15px 30px dimgrey;
        }

        #tres
        {
            background-color: LightPink;
            box-shadow: 15px 15px 10px dimgrey;
        }

    </style>
</head>

<body>

    <div id="uno"></div>

    <div id="dos"></div>

    <div id="tres"></div>

</body>
</html>
