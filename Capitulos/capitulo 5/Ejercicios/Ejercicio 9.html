<!DOCTYPE html>
<html lang="es">
   <head>
      <meta charset="UTF-8">
      <title>Ejercicio 5.9 - Animación Cuadrada</title>
      <style>
        .contenedor {
        position: relative;
        width: 300px;
        height: 300px;
        border: 2px dashed white;
        margin: 20px;
    }

       .cuadro {
        width: 50px;
        height: 50px;
        background-color: navy;
       position: absolute;
       top: 0;
       left: 0;
       border-radius: 6px;
       animation: moverCuadrado 4s linear infinite;
    }

    @keyframes moverCuadrado {
      0%   { top: 0px;   left: 0px; }
      25%  { top: 0px;   left: 200px; }
      50%  { top: 200px; left: 200px; }
      75%  { top: 200px; left: 0px; }
      100% { top: 0px;   left: 0px; }
    }
     </style>
   </head>
  <body>
  <h2>Animación en Patrón Cuadrado Infinito</h2>
  <div class="contenedor">
     <div class="cuadro"></div>
   </div>
  </body>
</html>
