<!DOCTYPE html>

<!-- Ejercicio 5.5: esquinas.html -->
<!-- Crear esquinas redondeadas. -->

<html>
<head>
    <meta charset="utf-8">
    <title>Esquinas redondeadas</title>

    <style type="text/css">

        div
        {
            width: 200px;
            height: 100px;
            border: 3px black solid;
            margin: 20px;
            padding: 20px;
        }

        #uno
        {
            border-radius: 10px;
            background-color: lightblue;
        }

        #dos
        {
            border-radius: 50px;
            background-color: lightseagreen;
        }

        #tres
        {
            border-radius: 100px;
            background-color: lightsteelblue;
        }

    </style>
</head>

<body>

    <div id="uno">
        <b>border-radius: 10px</b>
    </div>

    <div id="dos">
        <b>border-radius: 50px</b>
    </div>

    <div id="tres">
        <b>border-radius: 100px</b>
    </div>

</body>
</html>
